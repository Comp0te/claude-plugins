name: checks

on:
  push:
  pull_request:

jobs:
  shared-sync:
    name: shared text blocks are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-shared.py --check
      - run: python3 -m unittest discover -s tests/shared-blocks

  structure:
    name: plugin structure is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-structure.py

  hunk-map:
    name: review-flow hunk-map matches its fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # original-awk is the one-true-awk macOS ships as /usr/bin/awk
      - run: sudo apt-get update && sudo apt-get install -y original-awk gawk mawk
      - run: python3 scripts/check-hunk-map.py
