name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shared-sync:
    name: shared text blocks are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/sync-shared.py --check
      - run: python3 -m unittest discover -s tests/shared-blocks

  structure:
    name: plugin structure is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-structure.py
      - run: python3 -m unittest discover -s tests/review-flow/check-structure

  unit-tests:
    name: unit tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s plugins/plan-flow/hooks -p 'test_*.py'
      - run: python3 -m unittest discover -s plugins/plan-flow/evals -p 'test_*.py'
      - run: python3 -m unittest discover -s plugins/plan-flow/evals/e2e -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/review-flow/reviewer-evals -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/review-flow/roster-stats

  claude-cli:
    name: manifests validate and the progress pane's tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: for p in . plugins/*; do claude plugin validate "$p" || exit 1; done
      - run: claude plugin test plugins/plan-flow

  hunk-map:
    name: review-flow hunk-map matches its fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # original-awk is the one-true-awk macOS ships as /usr/bin/awk
      - run: sudo apt-get update && sudo apt-get install -y original-awk gawk mawk
      - run: python3 scripts/check-hunk-map.py
