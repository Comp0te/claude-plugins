schema_version: "1.1"
name: 13-cmd-no-plan-argument
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: no-dispatch
    tool: Agent
    min: 0
    max: 0
  - type: tool_used
    name: nothing-written
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: lists-and-asks
    focus: last_message
    criteria: |
      The repository holds two plans: `docs/plans/2026-09-11-truncate.md` and
      `docs/plans/2026-09-12-export-csv/plan.md` (a directory containing `plan.md`).

      Check two claims about the reply:

      1. It names both plans.
      2. It asks which one to run, rather than choosing one and proceeding.

      Pass only if both hold. Ignore wording, formatting and ordering.
    weight: 1
