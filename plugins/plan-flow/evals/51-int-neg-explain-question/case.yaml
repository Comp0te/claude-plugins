schema_version: "1.1"
name: 51-int-neg-explain-question
tags: [intent]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    How does `requireRole` decide whether a call is allowed?
  max_turns: 10
  timeout_seconds: 300
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Agent, Read, Glob, Grep, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: no-skill
    tool: Skill
    input_match: shaping-intent
    min: 0
    max: 0
    weight: 1
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
    weight: 0.5
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
    weight: 0.5
