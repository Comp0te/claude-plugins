schema_version: "1.1"
name: 15-cmd-legacy-plan-no-frozen-header
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan docs/plans/2025-11-03-flag-parsing.md
  max_turns: 40
  timeout_seconds: 900
  model: sonnet
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: dispatched
    tool: Agent
    input_match: 'docs/plans/2025-11-03-flag-parsing\.md'
    min: 1
  - type: tool_used
    name: no-line-range
    tool: Agent
    input_match: '[Ll]ine range|[Ll]ines?\s+\d+\s*[-–]\s*\d+|:\d+-\d+'
    min: 0
    max: 0
  - type: llm
    name: says-legacy
    focus: last_message
    criteria: |
      The plan carries no `<frozen-after-approval>` block — it predates the current
      format.

      Pass only if the reply tells the reader that the plan has no frozen header (or
      predates the format) and that it is therefore being handed over whole rather than
      by task slice. A run that simply proceeds without saying so fails, even if the
      work itself was correct.
    weight: 1
