schema_version: "1.1"
name: 32-dbg-flaky-fixed-delay
tags: [debugging]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    This test fails now and then on CI. Make it reliable. Tests run with `npm test`.
  max_turns: 30
  timeout_seconds: 600
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '(?<!systematic-)debugging'
    min: 1
  - type: regex
    name: fixed-delay-gone
    target:
      source: file
      path: test/job.test.js
    pattern: 'setTimeout\(r,\s*20\)'
    match: not_contains
    weight: 1
  - type: regex
    name: polling-wait
    target:
      source: file
      path: test/job.test.js
    pattern: '(while|for)\s*\(|waitFor|once\(|on\(''done'''
    match: contains
    weight: 1
  - type: llm
    name: explains-the-race
    focus: last_message
    criteria: |
      Does the reply explain the failure as a race between a fixed delay and a variable
      completion time?
    weight: 1
