schema_version: "1.1"
name: 34-dbg-neg-explain-code
tags: [debugging]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    How does `src/report/write.js` decide where to write?
  max_turns: 30
  timeout_seconds: 600
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: '(?<!systematic-)debugging'
    min: 0
    max: 0
  - type: tool_used
    name: no-edits
    tool: Edit
    max: 0
