schema_version: "1.1"
name: 52-cmd-archive-finished-plan
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan docs/plans/2026-10-28-slugify.md
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: file_exists
    name: archived
    path: docs/plans/archive/2026-10-28-slugify.md
    exists: true
    weight: 1
  - type: file_exists
    name: moved-not-copied
    path: docs/plans/2026-10-28-slugify.md
    exists: false
    weight: 1
  - type: llm
    name: names-new-location
    focus: last_message
    criteria: |
      The run executed a one-task plan to completion, and the plan was then moved to
      `docs/plans/archive/2026-10-28-slugify.md`.

      Pass only if the reply states that the plan now lives under `docs/plans/archive/`.
      Ignore wording and formatting.
    weight: 0.5
