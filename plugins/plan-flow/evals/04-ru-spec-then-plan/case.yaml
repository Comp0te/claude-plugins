schema_version: "1.1"
name: 04-ru-spec-then-plan
tags: [plan-writing]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Напиши план имплементации для задач 1-3, я запущу его после того, как приготовлю verification
    check. Код пока не пиши. Положи план в `docs/plans/2026-09-12-push-registration.md`.

    1. Токен пуш-уведомлений сейчас регистрируется один раз при старте приложения и никогда не
       перевыпускается — если FCM его ротировал, бэкенд об этом не узнает.
    2. При логауте токен не отзывается, поэтому следующий пользователь на том же устройстве
       получает пуши предыдущего.
    3. Ретраев нет: если регистрация упала из-за сети, повторной попытки не будет до следующего
       холодного старта.

    Файлы, которые нужны:

    - `src/push/register.ts` — `registerPushToken()`, вызывается из `src/app/bootstrap.ts`.
    - `src/push/api.ts` — `postDevice(token)` и `deleteDevice(token)`; второй нигде не вызывается.
    - `src/auth/useLogout.ts` — чистит стор и навигацию, про пуши не знает.
    - `src/lib/queue.ts` — `enqueue(task, { retries })`, уже используется для аналитики.

    Тесты: `npm test` (jest). Типы: `npm run typecheck`.
  max_turns: 45
  timeout_seconds: 900
  model: sonnet
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit]
runs: 3
graders:
  - type: regex
    name: block-labels
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '```[a-zA-Z]*[ \t]+(contract|reference)\b'
    match: contains
    weight: 0.5
  - type: regex
    name: code-map-annotated
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '\*\*Code Map[\s\S]{0,2500}`[\w./@-]+\.[a-zA-Z]+:\d+(-\d+)?`'
    match: contains
    weight: 0.5
  - type: regex
    name: constraint-tiers
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '\*\*Always:\*\*[\s\S]{0,6000}\*\*Ask First:\*\*[\s\S]{0,6000}\*\*Never:\*\*'
    match: contains
    weight: 0.5
  - type: llm
    name: covers-the-request
    focus:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    criteria: |
      One question only: does every requirement below map to at least one task in this plan?

      - the push token is re-registered when FCM rotates it, not only once at startup
      - the token is revoked on logout, so the next user on the device does not receive the previous
        user's notifications
      - a registration that fails on a network error is retried, rather than waiting for the next
        cold start

      Go through the list item by item and say, for each, which task covers it — or say it is
      uncovered. Pass only if every item is covered by a named task.

      Ignore everything else: formatting, section order, length, whether the code in the plan would
      compile, and whether the plan is well written. Those are checked by other graders. Judge
      coverage and nothing else.
    weight: 1
  - type: regex
    name: exec-header
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '##\s+How to execute this plan'
    match: contains
    weight: 0.5
  - type: regex
    name: frozen-block
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '<frozen-after-approval'
    match: contains
    weight: 0.5
  - type: regex
    name: no-placeholders
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: 'similar to Task \d|add appropriate error handling|FILL_IN|\|\s*TBD\s*\||:\s*TBD\s*$'
    match: not_contains
    flags: i
    weight: 0.5
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: writing-implementation-plans
    min: 1
  - type: regex
    name: verification-commands
    target:
      source: file
      path: docs/plans/2026-09-12-push-registration.md
    pattern: '\*\*Verification[\s\S]{0,900}`(npm|yarn|pnpm|npx)'
    match: contains
    weight: 0.5
