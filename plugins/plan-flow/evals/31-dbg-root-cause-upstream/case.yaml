schema_version: "1.1"
name: 31-dbg-root-cause-upstream
tags: [debugging]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Reports end up in the project root instead of `out/`. Fix it. Tests run with `npm test`.
  append_system_prompt: |
    The project's working agreements include the section below. Follow it.

    ## Before Writing Code

    - Ask before writing code only where the readings of a requirement lead to materially
      different work; otherwise take the reasonable reading and name the assumption in one line.
    - When there's a bug, start by writing a test that reproduces it, then fix it without editing that test.
  max_turns: 30
  timeout_seconds: 600
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '(?<!systematic-)debugging'
    min: 1
  - type: regex
    name: default-no-longer-empty
    target:
      source: file
      path: src/config.js
    pattern: 'REPORT_DIR\s*(\?\?|\|\|)\s*(''''|""|``)'
    match: not_contains
    weight: 1
  - type: llm
    name: names-cause-and-reports-test
    focus: last_message
    criteria: |
      Does the reply name the empty default in config as the cause and report a test that failed
      before the fix and passes after? Pass only if both.
    weight: 1
