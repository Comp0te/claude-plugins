schema_version: "1.1"
name: 47-int-resume-approved-with-change
tags: [intent]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:shaping-intent Dana approved the notes export intent in
    docs/plans/2026-11-02-notes-export/, with one change — the downloaded file's name has to
    include the export date. Everything else stands.
  max_turns: 60
  timeout_seconds: 1500
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Agent, Read, Glob, Grep, Write, Edit]
runs: 3
graders:
  - type: regex
    name: status-approved-by-dana
    target:
      source: file
      path: docs/plans/2026-11-02-notes-export/intent.md
    pattern: '^Status:\s*approved[^\n]*Dana'
    match: contains
    flags: m
    weight: 1
  - type: regex
    name: revision-recorded
    target:
      source: file
      path: docs/plans/2026-11-02-notes-export/intent.md
    pattern: '##\s+Revisions[\s\S]{0,1200}(file ?name|filename)'
    match: contains
    flags: i
    weight: 0.5
  - type: regex
    name: change-attributed
    target:
      source: file
      path: docs/plans/2026-11-02-notes-export/intent.md
    pattern: '\|[^\n]*(file ?name|filename)[^\n]*DECIDED \(Dana|DECIDED \(Dana[^\n]*(file ?name|filename)'
    match: contains
    flags: i
    weight: 0.5
  - type: tool_used
    name: handed-to-planning
    tool: Skill
    input_match: writing-implementation-plans
    min: 1
    weight: 0.5
  - type: file_exists
    name: plan-beside-intent
    path: docs/plans/2026-11-02-notes-export/plan.md
    exists: true
    weight: 0.5
