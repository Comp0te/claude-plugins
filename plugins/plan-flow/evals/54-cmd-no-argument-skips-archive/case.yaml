schema_version: "1.1"
name: 54-cmd-no-argument-skips-archive
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: no-dispatch
    tool: Agent
    min: 0
    max: 0
  - type: llm
    name: lists-open-only
    focus: last_message
    criteria: |
      The repository holds one open plan, `docs/plans/2026-10-28-a.md`, and one finished plan
      in `docs/plans/archive/2026-10-01-old.md`.

      Check two claims about the reply:

      1. It names `2026-10-28-a.md` and does not offer `2026-10-01-old.md` as a plan to run.
      2. It asks which plan to run (or to confirm the one), rather than proceeding.

      Pass only if both hold. Mentioning that archived plans were skipped is fine.
    weight: 1
