schema_version: "1.1"
name: 43-cmd-resume-contradictory-record
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan docs/plans/2026-10-20-csv-fields.md
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: no-dispatch
    tool: Agent
    min: 0
    max: 0
    weight: 0.5
  - type: llm
    name: names-disagreement-and-asks
    focus: last_message
    criteria: |
      The plan's record and the repository disagree. Task 2 has a commit but its step checkboxes
      are unticked, and task 3's file `src/export.js` has an uncommitted edit.

      Does the reply point out that the plan's record and the repository disagree, and ask
      before dispatching? Pass only if both parts hold. Ignore wording and formatting.
    weight: 1
