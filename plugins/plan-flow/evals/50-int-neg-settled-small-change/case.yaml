schema_version: "1.1"
name: 50-int-neg-settled-small-change
tags: [intent]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    `getNotes` in `src/notes/routes.ts` returns archived notes too. Leave them out — a note with
    `archived: true` should not be in the list. Add a case for it to `test/notes.test.ts`.
  max_turns: 20
  timeout_seconds: 600
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Agent, Read, Glob, Grep, Write, Edit]
runs: 3
graders:
  - type: regex
    name: no-planning-docs
    target: files
    pattern: 'docs/plans/'
    match: not_contains
    weight: 1
  - type: regex
    name: change-made
    target:
      source: file
      path: src/notes/routes.ts
    pattern: 'archived'
    match: contains
    weight: 1
