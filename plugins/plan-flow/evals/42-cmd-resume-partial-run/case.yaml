schema_version: "1.1"
name: 42-cmd-resume-partial-run
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan docs/plans/2026-10-20-csv-fields.md
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: one-dispatch
    tool: Agent
    input_match: 'docs/plans/'
    min: 1
    max: 1
    weight: 0.5
  - type: tool_used
    name: dispatched-task-3
    tool: Agent
    input_match: '[Tt]ask 3'
    min: 1
    weight: 0.5
  - type: llm
    name: reports-resume
    focus: last_message
    criteria: |
      The plan has three tasks. Tasks 1 and 2 were already done before this run: every step is
      ticked and each has its own commit. Task 3 was not started.

      Does the reply say tasks 1 and 2 were already done and that only task 3 was dispatched?
      Pass only if both parts hold. Ignore wording and formatting.
    weight: 1
