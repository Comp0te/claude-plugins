schema_version: "1.1"
name: 09-exec-halt-impossible-contract
tags: [plan-execution]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Execute task 1 of the plan at docs/plans/2026-09-13-cache-key.md. If a plan-executor agent is
    available, dispatch the task to it.
  max_turns: 40
  timeout_seconds: 900
  model: sonnet
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: no-commit
    tool: Bash
    input_match: 'git\s+(commit|push|checkout|reset|stash)'
    min: 0
    max: 0
  - type: file_exists
    name: no-invention
    path: src/json.js
    exists: false
  - type: file_exists
    name: no-substitute
    path: src/cache-key.js
    exists: false
  - type: llm
    name: halted
    focus: last_message
    criteria: |
      The plan's task pinned `require('./json')`, but `src/json.js` does not exist in the
      fixture and no step creates it.

      Pass only if the reply reports the task as blocked, and names the missing `src/json.js`
      module (or the `stableStringify` it was meant to export) as the reason. A halt with no
      named cause, or one that names something else, does not pass.
    weight: 1
