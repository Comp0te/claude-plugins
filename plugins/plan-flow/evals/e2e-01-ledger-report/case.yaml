schema_version: "1.1"
name: e2e-01-ledger-report
tags: [e2e]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    В этом репозитории есть маленький CLI над журналом транзакций (`bin/ledger.js`,
    команды `add` и `total`, журнал в JSONL). Нужны команда `report` с тремя форматами
    вывода и команда `migrate` для журналов старого формата.

    `report`:

    - `node bin/ledger.js report --file <path>` печатает по строке на категорию:
      `<категория> <сумма в центах>`, категории отсортированы по имени по возрастанию.
    - `--from YYYY-MM-DD` и `--to YYYY-MM-DD` ограничивают диапазон дат, обе границы
      включительно; любую можно не указывать.
    - `--category NAME` оставляет одну категорию.
    - Пустой журнал, пустой диапазон и неизвестная категория — пустой вывод и код 0.
    - Категория, суммы которой гасят друг друга, печатается со значением `0`.
    - Битая строка в журнале — сообщение в stderr и ненулевой код возврата, пустой stdout.

    Форматы вывода `report`:

    - `--format text` — формат по умолчанию, описанный выше.
    - `--format csv` — первая строка `category,amount`, дальше по строке на категорию,
      порядок тот же.
    - `--format json` — массив объектов `{"category": ..., "amount": ...}` одной строкой,
      порядок тот же; пустой результат — `[]`.
    - Неизвестное значение `--format` — сообщение в stderr, ненулевой код, пустой stdout.

    `migrate`:

    - Журналы старого формата хранят дату как `DD.MM.YYYY`, а сумму в поле `sum`:
      `{"date":"05.01.2024","category":"food","sum":1200}`.
    - `node bin/ledger.js migrate --file <path>` переписывает файл в текущий формат
      (`date` в ISO, сумма в поле `amount`) и печатает `migrated <N>` — сколько строк
      переписано.
    - Строки, уже записанные в текущем формате, остаются как есть и в счёт не идут:
      повторный `migrate` печатает `migrated 0` и файла не меняет.
    - Битая строка — сообщение в stderr, ненулевой код, файл не изменён.

    Суммы целые, в центах.

    Напиши план реализации. Код пока не пиши.

    Тесты: `node --test test/*.test.js`.
  max_turns: 45
  timeout_seconds: 900
  model: sonnet
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit]
runs: 2
graders:
  - type: regex
    name: plan-location
    target: files
    pattern: 'docs/plans/2\d{3}-\d{2}-\d{2}-[a-z0-9-]+(/plan)?\.md'
    match: contains
    weight: 1
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: writing-implementation-plans
    min: 1
