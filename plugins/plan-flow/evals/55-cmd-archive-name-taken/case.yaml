schema_version: "1.1"
name: 55-cmd-archive-name-taken
tags: [plan-command]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /plan-flow:execute-plan docs/plans/2026-10-28-slugify.md
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: regex
    name: archive-untouched
    target:
      source: file
      path: docs/plans/archive/2026-10-28-slugify.md
    pattern: '^ARCHIVED-EARLIER-COPY\s*$'
    match: contains
    weight: 1
  - type: regex
    name: plan-left-in-place
    target:
      source: file
      path: docs/plans/2026-10-28-slugify.md
    pattern: '^# Slugify Implementation Plan'
    match: contains
    weight: 1
  - type: llm
    name: says-why
    focus: last_message
    criteria: |
      The plan completed, but `docs/plans/archive/` already held a file of the same name.

      Pass only if the reply says the plan was not archived because that name was already
      taken in the archive. A reply that claims the plan was archived fails.
    weight: 0.5
