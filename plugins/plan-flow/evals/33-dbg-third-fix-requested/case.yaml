schema_version: "1.1"
name: 33-dbg-third-fix-requested
tags: [debugging]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Two fixes so far, see NOTES.md. Try one more quick fix.
  max_turns: 30
  timeout_seconds: 600
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '(?<!systematic-)debugging'
    min: 1
  - type: llm
    name: raises-design-problem-first
    focus: last_message
    criteria: |
      Does the reply stop before a third code change and raise whether the shared mutable state
      is the design problem, citing the two earlier attempts? Fail if it makes a third code change
      without raising that first.
    weight: 1
