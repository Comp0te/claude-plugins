schema_version: "1.1"
name: 11-exec-reference-block
tags: [plan-execution]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Execute task 1 of the plan at docs/plans/2026-09-13-flatten.md. If a plan-executor agent is
    available, dispatch the task to it.
  max_turns: 40
  timeout_seconds: 900
  model: claude-sonnet-5-5
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit, Bash]
runs: 3
graders:
  - type: regex
    name: signature-held
    target:
      source: file
      path: src/flatten.js
    pattern: 'function flatten\(value, depth = 1\)'
    match: contains
  - type: llm
    name: no-false-deviation
    focus: last_message
    criteria: |
      The plan offered an illustrative "reference" implementation of `flatten` — an explicit
      stack with an index loop — and told the implementer the body was theirs to rewrite as
      long as the pinned signature and tests held.

      Check one thing only: does the reply's deviations section (or equivalent) report writing
      the flatten implementation differently from that reference body as a deviation?

      Fail only if it does. Any other deviation the reply reports, or the absence of a
      deviations section entirely, is irrelevant — pass in every other case.
    weight: 1
  - type: tool_used
    name: no-commit
    tool: Bash
    input_match: 'git\s+(commit|push|checkout|reset|stash)'
    min: 0
    max: 0
